name: Build & Publish Firmware (OTA)

# Deliberate releases only — NOT on every push, so we never mass-OTA by accident.
# Trigger by pushing a tag (v9.17) or running the workflow manually with a version.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: "Expected release version; must match platformio.ini. Empty = use project version."
        type: string
        required: false
      deploy:
        description: "Publish to the OTA folder (devices will update). false = build only."
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env: ESP8266_RELEASE,          mcu: ESP8266,         chip: esp8266, flash_size: 4MB }
          - { env: ESP8266-HAN_RELEASE,      mcu: ESP8266-HAN,     chip: esp8266, flash_size: 4MB }
          - { env: ESP32_RELEASE,            mcu: ESP32,           chip: esp32,   flash_size: 8MB }
          - { env: ESP32C6_IRRIGATION,       mcu: ESP32-C6,        chip: esp32c6, flash_size: 4MB }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        # intelhex is imported by the bundled esptool.py, which the full-flash merge
        # step runs directly; PlatformIO does not pull it in for its own builds.
        run: pip install -U platformio intelhex

      # tools/html_converter.py (run by extra_script.py during the build) embeds the
      # gzipped web panel into headers. The minifiers are pinned devDependencies,
      # not global installs: their exact output ends up inside the firmware image,
      # so the release must not depend on whatever version the runner resolves.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install web panel build tools
        run: |
          npm ci
          command -v xxd >/dev/null || sudo apt-get install -y -qq xxd
          for c in gzip xxd; do
            command -v "$c" >/dev/null || { echo "missing required command: $c"; exit 1; }
          done
          for c in html-minifier-terser uglifyjs uglifycss; do
            test -x "node_modules/.bin/$c" || { echo "missing build tool: $c (npm ci failed?)"; exit 1; }
          done

      - name: Resolve and verify version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DEPLOY: ${{ github.event.inputs.deploy }}
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(
            awk '
              /^[[:space:]]*\[extra\][[:space:]]*$/ {
                in_extra = 1
                next
              }
              /^[[:space:]]*\[/ {
                in_extra = 0
              }
              in_extra && /^[[:space:]]*version[[:space:]]*=/ {
                value = $0
                sub(/^[^=]*=[[:space:]]*/, "", value)
                sub(/[[:space:]]*[;#].*$/, "", value)
                sub(/[[:space:]]+$/, "", value)
                print value
                exit
              }
            ' platformio.ini
          )"

          if [ -z "$PROJECT_VERSION" ]; then
            echo "::error::Could not read [extra] version from platformio.ini"
            exit 1
          fi
          if ! [[ "$PROJECT_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Invalid version format in platformio.ini"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::Push release was not triggered by a tag"
              exit 1
            fi
            REQUESTED_VERSION="${GITHUB_REF_NAME#v}"
            DEPLOY=true
          else
            REQUESTED_VERSION="${INPUT_VERSION:-$PROJECT_VERSION}"
            DEPLOY="${INPUT_DEPLOY:-false}"
          fi

          case "$DEPLOY" in
            true|false) ;;
            *)
              echo "::error::Invalid deploy input"
              exit 1
              ;;
          esac

          if [ "$REQUESTED_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag/input version does not match platformio.ini version $PROJECT_VERSION"
            exit 1
          fi
          if [[ "$PROJECT_VERSION" == *-dev* ]]; then
            echo "::error::Release workflow refuses development version $PROJECT_VERSION"
            exit 1
          fi

          printf 'version=%s\n' "$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          printf 'deploy=%s\n' "$DEPLOY" >> "$GITHUB_OUTPUT"
          printf 'Building version %s for %s\n' "$PROJECT_VERSION" '${{ matrix.mcu }}'

      - name: Ensure local override exists
        run: touch platformio_override.ini

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Verify ESP8266 static-RAM budget
        if: ${{ startsWith(matrix.env, 'ESP8266') }}
        run: python3 tools/check_ram_budget.py --env ${{ matrix.env }}

      - name: Rename binary
        id: bin
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          NAME="ONOFRE_${{ matrix.mcu }}_RELEASE_${{ steps.ver.outputs.version }}.bin"
          mkdir -p out
          # tools/extra_script.py renames the output to
          # "Firmware_<env>_<version> - <date>.bin", so plain firmware.bin does not
          # exist. Match that first and keep firmware.bin as a fallback. Never glob
          # *.bin blindly: ESP32 build dirs also hold bootloader.bin/partitions.bin.
          # Never the .factory.bin: newer platform builds (the C6) emit a merged
          # bootloader+partitions+app image next to the application one, and this
          # step used to pick whichever find returned first. When it picked the
          # merged one, OTA published a bootloader as if it were an app: the device
          # downloaded it, wrote it, and refused to boot it — "Could Not Activate
          # The Firmware". Every C6 release from 9.180 to 9.190 shipped that way.
          SRC=$(find "$BUILD_DIR" -maxdepth 1 -name 'Firmware_*.bin' ! -name '*.factory.bin' -print -quit)
          [ -n "$SRC" ] || SRC="$BUILD_DIR/firmware.bin"
          if [ ! -f "$SRC" ]; then
            echo "No firmware binary found in $BUILD_DIR:"; ls -la "$BUILD_DIR"; exit 1
          fi
          case "$SRC" in
            *.factory.bin) echo "::error::refusing to publish a merged factory image as the OTA application"; exit 1 ;;
          esac
          cp "$SRC" "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Built from: $SRC"
          ls -l "out/$NAME"

      # The OTA binary holds only the application partition, so it cannot program a
      # blank chip. Build the image the browser installer at /flash/ serves: ESP8266
      # builds are already complete, ESP32 ones need bootloader/partitions/boot_app0.
      - name: Build full-flash image
        id: webflash
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          NAME="ONOFRE_${{ matrix.mcu }}_WEBFLASH_${{ steps.ver.outputs.version }}.bin"
          APP="out/${{ steps.bin.outputs.name }}"
          [ -f "$APP" ] || { echo "missing OTA application: $APP"; exit 1; }
          mkdir -p webflash
          if [ "${{ matrix.chip }}" = "esp8266" ]; then
            cp "$APP" "webflash/$NAME"
          elif [ -n "$(find "$BUILD_DIR" -maxdepth 1 -name '*.factory.bin' -print -quit)" ]; then
            # Newer platform builds (the C6 target) already emit a merged image with
            # the bootloader at the offset that chip expects — 0x0 there, not 0x1000.
            # Copying it beats re-deriving the offsets per chip, and the bundled
            # esptool 5 renamed the merge subcommand anyway.
            cp "$(find "$BUILD_DIR" -maxdepth 1 -name '*.factory.bin' -print -quit)" "webflash/$NAME"
          else
            ESPTOOL=$(find "$HOME/.platformio/packages" -name esptool.py -path '*tool-esptoolpy*' -print -quit)
            BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin -print -quit)
            for f in "$ESPTOOL" "$BOOT_APP0" "$BUILD_DIR/bootloader.bin" "$BUILD_DIR/partitions.bin"; do
              [ -n "$f" ] && [ -f "$f" ] || { echo "missing input for merge: '$f'"; exit 1; }
            done
            python3 "$ESPTOOL" --chip ${{ matrix.chip }} merge_bin -o "webflash/$NAME" \
              --flash_mode dio --flash_freq 40m --flash_size ${{ matrix.flash_size }} \
              0x1000 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0xe000 "$BOOT_APP0" \
              0x10000 "$APP"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -l "webflash/$NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bin.outputs.name }}
          path: out/${{ steps.bin.outputs.name }}

      - name: Upload full-flash artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.webflash.outputs.name }}
          path: webflash/${{ steps.webflash.outputs.name }}

      - name: Publish to OTA folder
        if: ${{ steps.ver.outputs.deploy == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "out/${{ steps.bin.outputs.name }}"
          target: "/mnt/HC_Volume_34871065/v01/CLOUDIO/FIRMWARE/${{ matrix.mcu }}/"
          strip_components: 1

      - name: Publish full-flash image (browser installer)
        if: ${{ steps.ver.outputs.deploy == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "webflash/${{ steps.webflash.outputs.name }}"
          target: "/mnt/HC_Volume_34871065/v01/CLOUDIO/FIRMWARE/WEBFLASH/${{ matrix.mcu }}/"
          strip_components: 1

  # One message per release, not one per matrix job. Runs after every variant has
  # built, only for a real deploy, and never fails the release: a firmware that
  # shipped but was not announced still shipped.
  announce:
    needs: build
    if: ${{ always() && needs.build.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Announce on Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRODUCT: "OnOfre Firmware"
          VERSION: ${{ github.ref_name }}
        run: |
          # The tag is v9.182; the changelog heading is 9.182.
          export VERSION="${VERSION#v}"
          python3 .github/scripts/notify_telegram.py
