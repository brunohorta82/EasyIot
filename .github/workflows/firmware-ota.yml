name: Build & Publish Firmware (OTA)

# Deliberate releases only — NOT on every push, so we never mass-OTA by accident.
# Trigger by pushing a tag (v9.17) or running the workflow manually with a version.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 9.17). Empty = use platformio.ini [extra].version"
        required: false
      deploy:
        description: "Publish to the OTA folder (devices will update). false = build only."
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env: ESP8266_RELEASE,          mcu: ESP8266,         chip: esp8266, flash_size: 4MB }
          - { env: ESP8266-HAN_RELEASE,      mcu: ESP8266-HAN,     chip: esp8266, flash_size: 4MB }
          - { env: ESP32_RELEASE,            mcu: ESP32,           chip: esp32,   flash_size: 8MB }
          - { env: ESP32-MAKER-4MB_RELEASE,  mcu: ESP32-MAKER-4MB, chip: esp32,   flash_size: 4MB }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      # tools/html_converter.sh (run by extra_script.py during the build) embeds the
      # gzipped web panel into headers and needs these CLI minifiers plus xxd.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web panel build tools
        run: |
          npm install -g html-minifier uglify-js uglifycss
          command -v xxd >/dev/null || sudo apt-get install -y -qq xxd
          for c in html-minifier uglifyjs uglifycss gzip xxd; do
            command -v "$c" >/dev/null || { echo "missing required command: $c"; exit 1; }
          done

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then
            V=$(grep -E '^\s*version\s*=' platformio.ini | head -1 | sed -E 's/.*=\s*//' | tr -d ' ')
          fi
          V="${V%-dev}"            # a release must not carry the -dev suffix
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V for ${{ matrix.mcu }}"

      - name: Ensure local override exists
        run: touch platformio_override.ini

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Rename binary
        id: bin
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          NAME="ONOFRE_${{ matrix.mcu }}_RELEASE_${{ steps.ver.outputs.version }}.bin"
          mkdir -p out
          # tools/extra_script.py renames the output to
          # "Firmware_<env>_<version> - <date>.bin", so plain firmware.bin does not
          # exist. Match that first and keep firmware.bin as a fallback. Never glob
          # *.bin blindly: ESP32 build dirs also hold bootloader.bin/partitions.bin.
          SRC=$(find "$BUILD_DIR" -maxdepth 1 -name 'Firmware_*.bin' -print -quit)
          [ -n "$SRC" ] || SRC="$BUILD_DIR/firmware.bin"
          if [ ! -f "$SRC" ]; then
            echo "No firmware binary found in $BUILD_DIR:"; ls -la "$BUILD_DIR"; exit 1
          fi
          cp "$SRC" "out/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Built from: $SRC"
          ls -l "out/$NAME"

      # The OTA binary holds only the application partition, so it cannot program a
      # blank chip. Build the image the browser installer at /flash/ serves: ESP8266
      # builds are already complete, ESP32 ones need bootloader/partitions/boot_app0.
      - name: Build full-flash image
        id: webflash
        run: |
          BUILD_DIR=".pio/build/${{ matrix.env }}"
          NAME="ONOFRE_${{ matrix.mcu }}_WEBFLASH_${{ steps.ver.outputs.version }}.bin"
          APP=$(find "$BUILD_DIR" -maxdepth 1 -name 'Firmware_*.bin' -print -quit)
          [ -n "$APP" ] || APP="$BUILD_DIR/firmware.bin"
          mkdir -p webflash
          if [ "${{ matrix.chip }}" = "esp8266" ]; then
            cp "$APP" "webflash/$NAME"
          else
            ESPTOOL=$(find "$HOME/.platformio/packages" -name esptool.py -path '*tool-esptoolpy*' -print -quit)
            BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin -print -quit)
            for f in "$ESPTOOL" "$BOOT_APP0" "$BUILD_DIR/bootloader.bin" "$BUILD_DIR/partitions.bin"; do
              [ -n "$f" ] && [ -f "$f" ] || { echo "missing input for merge: '$f'"; exit 1; }
            done
            python3 "$ESPTOOL" --chip ${{ matrix.chip }} merge_bin -o "webflash/$NAME" \
              --flash_mode dio --flash_freq 40m --flash_size ${{ matrix.flash_size }} \
              0x1000 "$BUILD_DIR/bootloader.bin" \
              0x8000 "$BUILD_DIR/partitions.bin" \
              0xe000 "$BOOT_APP0" \
              0x10000 "$APP"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -l "webflash/$NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bin.outputs.name }}
          path: out/${{ steps.bin.outputs.name }}

      - name: Publish to OTA folder
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "out/${{ steps.bin.outputs.name }}"
          target: "/mnt/HC_Volume_34871065/v01/CLOUDIO/FIRMWARE/${{ matrix.mcu }}/"
          strip_components: 1

      - name: Publish full-flash image (browser installer)
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "webflash/${{ steps.webflash.outputs.name }}"
          target: "/mnt/HC_Volume_34871065/v01/CLOUDIO/FIRMWARE/WEBFLASH/${{ matrix.mcu }}/"
          strip_components: 1
