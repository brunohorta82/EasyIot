[platformio]
default_envs = ESP8266_DEBUG

extra_configs = platformio_override.ini

[extra]
version = 9.197

wifi_flags =
    ;-D WIFI_SSID='"XXXXXXXX"'  
    ;-D WIFI_SECRET='"XXXXXXXX"'

lib_deps =
    ; Versions are pinned on purpose. An unpinned dependency resolves to whatever
    ; upstream publishes next, which is how a renamed header in the SHT4x library
    ; silently broke every Linux build. The git URLs below still track their default
    ; branch — pin them to a tag or commit as each is verified.
    PZEM004T@1.1.5
    ArduinoJson@7.4.3
    PubSubClient@2.8
    AsyncWebServer=https://github.com/brunohorta82/ESPAsyncWebServer.git
    DHT=https://github.com/brunohorta82/DHT-sensor-library.git
    adafruit/Adafruit Unified Sensor@^1.1.14
    DallasTemperature@4.0.6
    Arduino-Log=https://github.com/thijse/Arduino-Log.git
    ESP KNX IP Library=https://github.com/brunohorta82/esp-knx-ip.git
    PZEM004Tv30=https://github.com/mandulaj/PZEM-004T-v30.git
    AsyncMqttClient@0.9.0
    lennarthennigs/Button2@^2.2.4
    ; Pinned: the unpinned git URL tracked upstream HEAD, and Sensirion renamed
    ; the header (SensirionI2CSht4x.h -> SensirionI2cSht4x.h) in a newer release.
    sensirion/Sensirion I2C SHT4x@1.1.2
    sensirion/Sensirion Core@^0.7.0
    SSD1306=https://github.com/adafruit/Adafruit_SSD1306.git
    LTR303=https://github.com/brunohorta82/LTR303.git
	teckel12/NewPing @ ^1.9.7
    OPENTERM=https://github.com/ihormelnyk/opentherm_library.git


default_flags= 
    -D VERSION='"${extra.version}"' 
    -D CONFIG_LANG_PT
    -D MQTT_MAX_PACKET_SIZE=1000 
    -D ARDUINOJSON_ENABLE_INFINITY=1 
    -D NTP_SERVER='"pt.pool.ntp.org"' 
    -D TZ_INFO='"WET-0WEST-1,M3.5.0/01:00:00,M10.5.0/02:00:00"' 
    -D ATOMIC_FS_UPDATE 
    -D PIO_FRAMEWORK_ARDUINO_LWIP_HIGHER_BANDWIDTH 
    -D USE_ASYNC_UDP 
    -D WEB_SECURE_ON  
    -D REALM='"onofre"'
    -D DEBUG_ONOFRE
    -D TEST_TEMPLATE
    -D LEGACY_PROVISON
    ;-D SKIP_HTML_CONVERT      ; skip html_converter.py (keeps existing headers)
    ;-D SKIP_RELEASE_VALIDATE  ; skip validate_release.py pre-build checks
    ${extra.wifi_flags}
   


[ESP32_C3]
platform = espressif32@6.4.0
framework = arduino
board = seeed_xiao_esp32c3
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
monitor_speed=115200
upload_speed=115200
board_build.partitions = partitions_custom_c3.csv
extra_scripts = pre:tools/extra_script.py, post:tools/post_extra_script.py
build_flags =
    ${extra.default_flags} 
    -DDYNAMIC_JSON_DOCUMENT_SIZE=3000 
    -D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
    -D HAN_MODE
lib_deps = ${extra.lib_deps} 
            TMF882x=https://github.com/sparkfun/SparkFun_Qwiic_TMF882X_Arduino_Library.git
            LD2410=https://github.com/ncmreynolds/ld2410.git
lib_ignore = ESPAsyncTCP



[ESP32_8M]
platform = espressif32@6.4.0
board =  esp32dev
framework = arduino
board_build.flash_mode = qio
board_upload.flash_size  = 8MB
board_upload.maximum_size = 8388608
monitor_filters = esp32_exception_decoder 
monitor_speed=115200
extra_scripts = pre:tools/extra_script.py, post:tools/post_extra_script.py
build_flags =
    ${extra.default_flags} 
    -DDYNAMIC_JSON_DOCUMENT_SIZE=3000 
    -DBOARD_HAS_PSRAM 
lib_deps = ${extra.lib_deps}
        JustWifi=https://github.com/xoseperez/justwifi.git#esp32
        TMF882x=https://github.com/sparkfun/SparkFun_Qwiic_TMF882X_Arduino_Library.git
        LD2410=https://github.com/ncmreynolds/ld2410.git
lib_ignore = ESPAsyncTCP

board_build.partitions = partitions_custom.csv


[env:ESP32_RELEASE]
extends = ESP32_8M
build_unflags=
   -D DEBUG_ONOFRE
    -D TEST_TEMPLATE

[env:ESP32_TEST]
extends = ESP32_8M
build_unflags=
    -D WEB_SECURE_ON 


[env:ESP32_DEBUG]
extends = ESP32_8M
build_unflags=
    -D WEB_SECURE_ON 
    -D TEST_TEMPLATE
    -D HAN_MODE



[env:ESP32C3_HAN]
extends = ESP32_C3
build_unflags=
    -D DEBUG_ONOFRE
    -D TEST_TEMPLATE
    -D LEGACY_PROVISON

[ESP8266]
platform = espressif8266@4.2.1
extra_scripts = pre:tools/extra_script.py, post:tools/post_extra_script.py
board = esp12e
framework = arduino
monitor_speed=115200
upload_speed=460800
board_build.flash_mode = dout
build_flags =
    ${extra.default_flags}
    -D DYNAMIC_JSON_DOCUMENT_SIZE=2048
    -D HAN_MODE
upload_resetmethod = nodemcu
monitor_filters = esp8266_exception_decoder
lib_deps = ${extra.lib_deps} 
    JustWifi=https://github.com/xoseperez/justwifi.git
lib_ignore = AsyncTCP


[env:ESP8266_RELEASE]
extends = ESP8266
board_build.f_cpu = 160000000L
build_unflags=
    -D DEBUG_ONOFRE
    -D TEST_TEMPLATE
    -D HAN_MODE

[env:ESP8266-HAN_RELEASE]
extends = ESP8266
build_unflags=
    -D DEBUG_ONOFRE
    -D TEST_TEMPLATE

[env:ESP8266-HAN_DEBUG]
extends = ESP8266
build_unflags=
    -D WEB_SECURE_ON
    -D TEST_TEMPLATE

[env:ESP8266_TEST]
extends = ESP8266
board_build.f_cpu = 160000000L
build_unflags=
    -D WEB_SECURE_ON 
    -D HAN_MODE

[env:ESP8266_DEBUG]
extends = ESP8266
board_build.f_cpu = 160000000L
monitor_speed=74880
build_flags =
    ${ESP8266.build_flags}
    -D DEBUG_SERIAL_BAUD=74880
build_unflags=
    -D WEB_SECURE_ON
    -D TEST_TEMPLATE
    -D HAN_MODE

; ---------------------------------------------------------------------------
; ESP32-C6 (DevKitC-1) — irrigation build.
; Kept on its own platform on purpose: the C6 only exists in Arduino 3.x
; (IDF 5.x), which the pinned espressif32@6.4.0 cannot provide. The existing
; environments stay where they are so the fleet's builds are untouched.
; LEGACY_PROVISON is kept (inherited from default_flags): it selects the captive
; portal path and compiles out WiFiProv/BLE provisioning entirely — which the C6
; could not use anyway, having no Bluetooth Classic to free.
;
; Build this environment ON ITS OWN. PlatformIO cannot hold two packages named
; "espressif32" in one process, so `pio run -e ESP32_RELEASE -e
; ESP32C6_IRRIGATION` fails inside the platform builder with FRAMEWORK_DIR=None.
; Pairing it with an ESP8266 environment is fine — different platform name.
;
; The first C6 run straight after an ESP32 build also fails, reproducibly, and
; succeeds on a retry. Same root cause: both platforms install as "espressif32"
; and share ~/.platformio/platforms/espressif32, so the ESP32 build leaves the
; other one's framework package unresolved. It surfaces as
;   arduino.py:534  Path(FRAMEWORK_DIR)  ->  TypeError: argument should be a str
;                                            or os.PathLike, not NoneType
; because get_package_dir() returned None; the failed run relinks it, which is
; why the next one works. Just run it again, or isolate the tree with
;   PLATFORMIO_CORE_DIR=~/.platformio-c6 pio run -e ESP32C6_IRRIGATION
; at the cost of a second toolchain download. CI is unaffected: its matrix runs
; one environment per job on a fresh runner.
; ---------------------------------------------------------------------------
[env:ESP32C6_IRRIGATION]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-c6-devkitc-1
board_build.mcu = esp32c6
board_build.partitions = partitions_custom_c6.csv
monitor_speed = 115200
extra_scripts = pre:tools/extra_script.py
build_flags =
    ${extra.default_flags}
    -D DYNAMIC_JSON_DOCUMENT_SIZE=3000
    -D ESP32C6
    ; The DevKitC-1's only port is the native USB-Serial/JTAG, so Serial has to be
    ; the USB CDC or nothing reaches the port at all — the C3 target does the same.
    ; Without this a board can be flashed but never explains itself.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Comes up as an irrigation controller on first boot, like HAN_MODE does for
    ; the meter, so a fresh board needs no template chosen by hand.
    -D IRRIGATION_MODE
build_unflags =
    -D DEBUG_ONOFRE
    -D TEST_TEMPLATE
    -D HAN_MODE
; Dependencies are listed in full rather than inheriting ${extra.lib_deps}: the
; shared list pins our archived-upstream AsyncWebServer fork, and since both it
; and the maintained ESP32Async release declare the library name
; "ESPAsyncWebServer", lib_ignore cannot separate them — they collide. Spelling
; the list out also documents exactly what this target pulls.
lib_deps =
    PZEM004T@1.1.5
    ArduinoJson@7.4.3
    PubSubClient@2.8
    DHT=https://github.com/brunohorta82/DHT-sensor-library.git
    adafruit/Adafruit Unified Sensor@^1.1.14
    DallasTemperature@4.0.6
    ; C6 support is on master but the newest release (2.3.8, May 2024) predates
    ; it, and 2.3.8 does not compile here.
    OneWire=https://github.com/PaulStoffregen/OneWire.git
    Arduino-Log=https://github.com/thijse/Arduino-Log.git
    ESP KNX IP Library=https://github.com/brunohorta82/esp-knx-ip.git
    PZEM004Tv30=https://github.com/mandulaj/PZEM-004T-v30.git
    AsyncMqttClient@0.9.0
    lennarthennigs/Button2@^2.2.4
    sensirion/Sensirion I2C SHT4x@1.1.2
    sensirion/Sensirion Core@^0.7.0
    SSD1306=https://github.com/adafruit/Adafruit_SSD1306.git
    LTR303=https://github.com/brunohorta82/LTR303.git
    teckel12/NewPing@^1.9.7
    OPENTERM=https://github.com/ihormelnyk/opentherm_library.git
    ; Sensors.cpp includes these under #ifdef ESP32, so an ESP32-family target
    ; needs them even when the board will never have the sensor.
    TMF882x=https://github.com/sparkfun/SparkFun_Qwiic_TMF882X_Arduino_Library.git
    LD2410=https://github.com/ncmreynolds/ld2410.git
    ; Our fork: upstream stopped in 2020 and calls WiFi.setAutoConnect(), which
    ; Arduino 3.x removed. The branch omits it on 3.x only, leaving ESP8266 and
    ; Arduino 2.x untouched, so the other environments could adopt it unchanged.
    JustWifi=https://github.com/brunohorta82/justwifi.git#arduino3-compat
    ; The maintained successor: me-no-dev/ESPAsyncWebServer, the base of our own
    ; fork, is archived, and our fork sits 630 commits behind while carrying 7
    ; (ArduinoJson 7, LittleFS, md5, c3) that this release already includes. It
    ; also uses the mbedtls 3.x API that IDF 5.x requires.
    ESPAsyncWebServer=https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.0
    AsyncTCP=https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
; ESPAsyncTCP is the ESP8266 transport, pulled in transitively; on an ESP32
; family target AsyncTCP is the one that applies.
lib_ignore = ESPAsyncTCP

; ---------------------------------------------------------------------------
; Same image with the logs left in, for bringing a board up. The release env
; unflags DEBUG_ONOFRE, so a misbehaving board has nothing to say; this one
; talks over the DevKitC-1's USB port.
; ---------------------------------------------------------------------------
[env:ESP32C6_IRRIGATION_DEBUG]
extends = env:ESP32C6_IRRIGATION
build_unflags =
    -D TEST_TEMPLATE
    -D HAN_MODE
